name: Bug report
description: Report a reproducible problem in Book-OCR
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Book-OCR. Never paste Gemini API keys, passwords, tokens, private PDFs, private OCR text, or user databases into this report.
  - type: input
    id: version
    attributes:
      label: Book-OCR version
      placeholder: "0.2.3"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "Windows 11 64-bit, version 24H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redistributable sample data.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Sanitize logs and screenshots. Do not attach private books or credential files.
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed API keys, passwords, private PDFs, private OCR text, personal paths, and other sensitive data.
          required: true
