name: Feature request
description: Suggest a focused improvement for Book-OCR
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the need without attaching private books, OCR text, API keys, passwords, or other credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain the smallest useful outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains no API keys, passwords, private PDFs, private OCR text, or other sensitive material.
          required: true
