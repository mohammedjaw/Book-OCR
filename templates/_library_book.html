<article class="card library-item standalone-item" data-book="{{b.book_uuid}}">
<div class="library-info"><span class="item-kind">{{tr('standalone')}}</span><h2><a dir="auto" href="/books/{{b.book_uuid}}">{{b.title}}</a></h2><p class="secondary" dir="auto">{{b.original_filename}}</p><p class="secondary">{{tr('page_count')}}: {{b.page_count}} · <span class="status-label status-{{b.status}}">{{tr(b.status)}}</span></p></div>
<div class="actions"><a class="button" href="/books/{{b.book_uuid}}">{{tr('open_book')}}</a><a class="button" href="/books/{{b.book_uuid}}/pages">{{tr('pages')}}</a></div>
</article>
