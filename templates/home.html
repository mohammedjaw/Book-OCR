{% extends 'base.html' %}{% block content %}<h1>مكتبة Book-OCR</h1><div class="grid"><div class="card"><b>{{ stats.books }}</b><span>عدد الكتب</span></div><div class="card"><b>{{ stats.pages }}</b><span>مجموع الصفحات</span></div><div class="card"><b>جاهز</b><span>حالة النظام</span></div></div><p>مسار تخزين الكتب: <code>books/</code></p><h2>المضافة مؤخرًا</h2>{% for b in recent %}<div class="row"><a href="/books/{{b.book_uuid}}">{{b.title}}</a><span>{{b.page_count}} صفحة</span></div>{% else %}<p>لا توجد كتب بعد.</p>{% endfor %}{% endblock %}
