{% extends 'base.html' %}{% block content %}<h1>الإعدادات</h1>{% if message %}<div class="success">{{message}}</div>{% endif %}<form method="post"><label>Gemini API Key<input type="password" name="api_key" value="{{settings.gemini_api_key}}"></label><label>النموذج<input name="model" value="{{settings.gemini_model}}"></label><label>مستوى التفكير<select name="thinking">{% for x in ['minimal','low','medium','high'] %}<option {% if settings.thinking_level==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><button>حفظ الإعدادات</button><button type="button" disabled>اختبار API (لاحقًا)</button></form>{% endblock %}
