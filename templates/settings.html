{% extends 'base.html' %}{% block content %}<h1>الإعدادات</h1>{% if message %}<div class="success">{{message}}</div>{% endif %}<form method="post"><label>المظهر<select id="theme" name="theme"><option>فاتح</option><option>داكن</option><option>تلقائي</option></select></label><label>Gemini API Key{% if settings.has_api_key %}<small>مفتاح API محفوظ</small>{% endif %}<input type="password" name="api_key" value=""></label><label>النموذج<input name="model" value="{{settings.gemini_model}}"></label><label>خط النص<input name="font_family" value="{{settings.font_family or 'Noto Naskh Arabic'}}"></label><label>حجم النص<input type="number" name="font_size" value="{{settings.font_size or 22}}"></label><label>تباعد الأسطر<input name="line_height" value="{{settings.line_height or 1.8}}"></label><button>حفظ الإعدادات</button></form><form method="post" action="/settings/test"><button>اختبار اتصال Gemini</button></form><script>let t=localStorage.theme||'تلقائي';theme.value=t;theme.onchange=()=>{localStorage.theme=theme.value;document.documentElement.dataset.theme=theme.value}</script>{% endblock %}
