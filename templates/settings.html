{% extends 'base.html' %}{% block content %}<h1>الإعدادات</h1>{% if message %}<div class="success">{{message}}</div>{% endif %}{% if test_result %}<div class="notice">{{test_result}}</div>{% endif %}<form method="post"><label>Gemini API Key{% if settings.has_api_key %}<small>مفتاح API محفوظ</small>{% endif %}<input type="password" name="api_key" value="" autocomplete="new-password"></label><label>النموذج<input name="model" value="{{settings.gemini_model}}"></label><label>عدد الصفحات المتوازية<input type="number" name="concurrency" min="1" max="5" value="{{settings.max_concurrent_pages or 3}}"></label><label>مستوى التفكير<select name="thinking">{% for x in ['minimal','low','medium','high'] %}<option {% if settings.thinking_level==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><button>حفظ الإعدادات</button></form><form method="post" action="/settings/test"><button>اختبار اتصال Gemini</button></form>{% endblock %}
