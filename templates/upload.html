{% extends 'base.html' %}{% block content %}<h1>رفع كتاب</h1>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post" enctype="multipart/form-data"><input id="pdf-file" type="file" name="file" accept="application/pdf" required><label>اسم الكتاب<input id="book-title" name="title" required></label><button>حفظ الكتاب</button></form><script>document.getElementById('pdf-file').onchange=function(){var t=document.getElementById('book-title');if(!t.value&&this.files[0])t.value=this.files[0].name.replace(/\.pdf$/i,'')}</script>{% endblock %}
