<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Book-OCR' }}</title><link rel="stylesheet" href="/static/css/style.css"></head><body><nav><a href="/">الرئيسية</a><a href="/books">الكتب</a><a href="/books/new">رفع كتاب</a><a href="/search">البحث</a><a href="/transfer">الاستيراد والتصدير</a><a href="/settings">الإعدادات</a></nav><main>{% block content %}{% endblock %}</main><script>if(document.getElementById('progress')){let u=location.pathname+'/ocr/status';async function p(){try{let d=await fetch(u).then(r=>r.json()),c=d.counts||{};for(let k of ['completed','processing','pending','failed']){let e=document.getElementById(k);if(e)e.textContent=c[k]||0}document.getElementById('progress').value=c.completed||0;document.getElementById('progress-text').textContent='تم استخراج '+(c.completed||0)+' من '+d.total+' صفحة';if(d.active||(c.processing||0)>0)setTimeout(p,2500)}catch(e){setTimeout(p,5000)}}p()}</script></body></html>
