<!doctype html>
<html lang="{{lang}}" dir="{{'ltr' if lang=='en' else 'rtl'}}" data-theme="{{prefs.theme or 'تلقائي'}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% if title %}{{ title }}{% elif request.url.path == '/' %}Book-OCR — {{ tr('home') }}{% elif request.url.path == '/books' %}Book-OCR — {{ tr('books') }}{% elif request.url.path == '/books/new' %}Book-OCR — {{ tr('upload') }}{% elif request.url.path == '/search' %}Book-OCR — {{ tr('search') }}{% elif request.url.path == '/transfer' %}Book-OCR — {{ tr('transfer') }}{% elif request.url.path == '/settings' %}Book-OCR — {{ tr('settings') }}{% elif request.url.path.startswith('/books/') %}Book-OCR — {{ tr('books') }}{% else %}Book-OCR{% endif %}</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/css/style.css?v=phase4-identity-1"></head>
<body><nav class="site-nav" aria-label="{{ tr('home') }}"><a class="brand" href="/" aria-label="Book-OCR"><svg aria-hidden="true" viewBox="0 0 64 64" focusable="false"><path d="M14 15c8-3 16-1 18 4v30c-4-4-11-5-18-2V15Zm36 0c-8-3-16-1-18 4v30c4-4 11-5 18-2V15Z"/><path d="M21 24h7m-7 7h7m8-7h7m-7 7h7"/></svg><span>Book-OCR</span></a><div class="nav-links">{% for path,key in [('/','home'),('/books','books'),('/books/new','upload'),('/search','search'),('/transfer','transfer'),('/settings','settings')] %}<a href="{{path}}" {% if request.url.path == path or (path == '/books' and request.url.path.startswith('/collections')) or (path == '/books' and request.url.path.startswith('/books/') and request.url.path != '/books/new') %}aria-current="page"{% endif %}>{{tr(key)}}</a>{% endfor %}</div></nav><main>{% block content %}{% endblock %}</main></body></html>
